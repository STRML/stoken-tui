name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: brew install stoken tmux
      - name: Unlock a keychain for the tests
        run: |
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security set-keychain-settings "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db"
      - run: python3 tests/e2e.py
